# qubes-plymouth-scramble settings (installed as /etc/qubes-plymouth-scramble.conf).
# Apply changes with: sudo qubes-plymouth-scramble install

[scramble]
# yes: new scrambled digit keys at the Plymouth disk password prompt on every boot
# no: stock prompt (install then disables the dracut module and rebuilds stock images)
enabled = yes

# The keyboard layout of the prompt follows the system (/etc/vconsole.conf), so letters type
# as at the stock prompt. Its digits must be typed without Shift, as on us, de or gb (not fr).
# The text console prompt, used when Plymouth is disabled on the kernel command line, always
# keeps standard digits.

# How the map is drawn, after the IllusionPIN paper (arXiv 1708.06508):
#   text      plain digits, readable from anywhere
#   highpass  the high-pass image of each digit: readable up close, it fades with distance
#   hybrid    the paper's hybrid keypad: the high-pass digit plus the low-pass standard keypad,
#             which is what a distant onlooker sees
#   white     hybrid with white buttons instead of the standard keypad (paper, section 9)
# The images are made for the screens connected at install. No masking stops a camera that zooms
# in closely; see README.md.
#display = text

# Safety distance in cm (paper, section 7.1): from here on an onlooker with good eyes, 30 degrees
# to the side, should not read the digits. A model estimate, not a guarantee; install refuses
# what the screen cannot show.
#safety_distance = 114

# High-pass filter:
#   tapered   zero below the cut-off, so no coarse trace of the digit is left
#   gaussian  the paper's Gaussian (section 5.2), which keeps a faint coarse trace
#highpass_filter = tapered

# High-pass cut-off in cycles per mm: the tapered filter's lower edge (its upper edge is twice
# that), or the Gaussian's sigma_hf:
#   auto      the paper's visibility algorithm (section 6) picks the lowest cut-off that keeps
#             the safety distance, but never below camera_floor
#   <number>  set by hand; the safety distance is then only estimated
#highpass_cutoff = auto

# Lowest cut-off auto may pick, in cycles per mm: zoomed phone photos resolve coarser patterns.
# 0 follows the paper's algorithm exactly, whose patterns such photos can read.
#camera_floor = 1.2

# Low-pass width of the hybrid and white decoys in cycles per mm (the paper's sigma_lf)
#lowpass_sigma = 0.265

# How the tiles' pixels are rounded to the screen's 8-bit levels:
#   diffusion   each pixel's rounding error goes to its neighbours (error diffusion), so the
#               rounding leaves no coarse trace of the digit
#   round       each pixel rounded on its own
#   compensate  rounded, and at Plymouth scale 2 corrected for Plymouth's interpolation, which
#               leaves more of a coarse trace than diffusion
#quantization = diffusion

# Screen pixels per inch, only if the screen reports its size wrongly
#ppi = 157

[digits]
# Optional letter group and #rrggbb colour shown under each digit (display = text only), for
# example phone-style groups for word-based passwords. The groups stay fixed; only the keys move.
# 2 = ABC
# 3 = DEF #ffb74d
