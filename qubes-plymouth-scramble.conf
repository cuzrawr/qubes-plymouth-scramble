# Builder settings: ~/.config/qubes-plymouth-scramble.conf in the builder qube.
# Build: ./qubes-plymouth-scramble-theme
# Preview: ./qubes-plymouth-scramble-theme --preview

[scramble]
# Screens from dom0, one per indented line: preferred mode marked + in xrandr, and physical
# size. Example (replace with your screen):
# screens = 1920x1080 300x170mm
#     2560x1440 600x340mm
# A connected xrandr header is accepted, but it names the ACTIVE mode; check that it matches
# the preferred mode used at boot. An omitted physical size gives text digits unless ppi is set.
screens =

# Directory in the builder qube for the complete theme archive and preview images.
#output = ~/QubesPlymouthScramble

# The keyboard layout of the prompt follows the system (/etc/vconsole.conf), so letters type
# as at the stock prompt. Its digits must be typed without Shift, as on us, de or gb (not fr).
# The text console prompt, used when Plymouth is disabled on the kernel command line, always
# keeps standard digits.

# How the map is drawn, after the IllusionPIN paper (arXiv 1708.06508):
#   text      plain digits, readable from anywhere
#   hybrid    the paper's hybrid keypad: the high-pass digit plus the low-pass standard keypad,
#             which is what a distant onlooker sees
#   white     hybrid with white buttons instead of the standard keypad (paper, section 9)
# The images are made for the configured screens. No masking stops a camera that zooms
# in closely; see README.md. A screen that cannot show them (too coarse, or without a reported
# size) gets text digits; the builder names it.
#display = hybrid

# Decoy amplitude in linear light, 0 to 0.6 (default 0.3). Zero keeps only the high-pass real
# digit. Higher values strengthen the decoy; values that make a tile exceed the screen's light
# range are refused. Applies to hybrid and white.
#decoy_amplitude = 0.3

# Digit size under the keys as a factor, 0.5 to 3 (1 without this line); key caps keep their
# size. Masked digits keep the cut-off and the estimated safety distance of size 1: larger
# digits are easier to read up close; their extra edges near that distance are not measured.
# The builder refuses a size the screen cannot fit and names the largest that fits.
size = 1.5

# Masked digits: yes puts them on one grey panel, no shows a grey tile per digit
#panel = yes

# Safety distance in cm (paper, section 7.1): from here on an onlooker with good eyes, 30 degrees
# to the side, should not read the digits. A model estimate, not a guarantee; the builder refuses
# a distance the screen cannot keep.
#safety_distance = 114

# High-pass filter:
#   tapered   zero below the cut-off, so no coarse trace of the digit is left
#   gaussian  the paper's Gaussian (section 5.2), which keeps a faint coarse trace
#highpass_filter = tapered

# High-pass cut-off in cycles per mm: the tapered filter's lower edge (its upper edge is twice
# that), or the Gaussian's sigma_hf:
#   auto      the paper's visibility algorithm (section 6) picks the lowest cut-off that keeps
#             the safety distance, but never below camera_floor
#   <number>  set by hand; the safety distance is then only estimated
#highpass_cutoff = auto

# Lowest cut-off auto may pick, in cycles per mm: zoomed phone photos resolve coarser patterns.
# 0 follows the paper's algorithm exactly, whose patterns such photos can read.
#camera_floor = 1.2

# Low-pass width of the hybrid and white decoys in cycles per mm at size 1 (the paper's
# sigma_lf); it scales with the digit, so larger decoys keep their blur
#lowpass_sigma = 0.265

# How the tiles' pixels are rounded to the screen's 8-bit levels:
#   diffusion   each pixel's rounding error goes to its neighbours (error diffusion), so the
#               rounding leaves no coarse trace of the digit
#   round       each pixel rounded on its own
#   compensate  rounded, and at Plymouth scale 2 corrected for Plymouth's interpolation, which
#               leaves more of a coarse trace than diffusion
#quantization = diffusion

# Screen pixels per inch, only if the screen reports its size wrongly or not at all (without
# a size it gets text digits)
#ppi = 157

[digits]
# Optional letter group and #rrggbb colour shown under each digit (display = text only), for
# example phone-style groups for word-based passwords. The groups stay fixed; only the keys move.
# 2 = ABC
# 3 = DEF #ffb74d
